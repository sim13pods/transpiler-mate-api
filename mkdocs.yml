site_name: Transpiler Mate API
site_description: Stable contracts for independently packaged Transpiler Mate plugins.
site_author: Terradue
site_url: https://transpiler-mate.github.io/transpiler-mate-api/
repo_url: https://github.com/transpiler-mate/transpiler-mate-api
repo_name: transpiler-mate/transpiler-mate-api

nav:
  - Home: index.md
  - Tutorials:
      - Build your first plugin: tutorials/build-your-first-plugin.md
  - How-to guides:
      - Develop and package a plugin: how-to/develop-a-plugin.md
      - Define and validate options: how-to/define-options.md
      - Resolve another CWL source: how-to/resolve-another-source.md
      - Report failures correctly: how-to/report-failures.md
      - Test a plugin: how-to/test-a-plugin.md
  - Reference:
      - Plugin API: reference/plugin-api.md
      - Context API: reference/context-api.md
      - Exception contract: reference/exceptions.md
      - Software metadata models: reference/software-metadata.md
  - Explanation:
      - Architecture and boundaries: explanation/architecture.md
      - Failure semantics: explanation/failure-semantics.md

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - python
    - toml
    - bash
  navigation_depth: 3
  collapse_navigation: false
  titles_only: false

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true

strict: true
